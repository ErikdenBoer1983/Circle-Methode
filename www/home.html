<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Methode</title>
<style>
  :root {
    --ink: #2b2620; --ink-soft: #55504a; --paper: #fdfcfa; --panel: #f6f1e9;
    --accent: #D9743D; --accent-soft: #F5C6A0; --accent2: #4E9670; --accent2-soft: #C8E6D3;
    --rule: #e2d8c8;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100%; height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--accent-soft) 0%, var(--paper) 45%, var(--accent2-soft) 100%);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .home { max-width: 420px; width: 100%; text-align: center; }
  .logo-wrap { background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 8px 28px rgba(43,38,32,0.14); display: inline-block; margin-bottom: 22px; cursor: pointer; border: none; }
  .logo-wrap img { max-height: 130px; width: auto; display: block; }
  h1 { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif; font-size: 2rem; margin: 0 0 6px; color: var(--ink); }
  p.by { margin: 0 0 34px; color: var(--ink-soft); font-size: 1rem; }
  p.by strong { color: var(--accent); }
  .choices { display: flex; flex-direction: column; gap: 16px; }
  .choice { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 16px; padding: 18px 20px; text-decoration: none; color: var(--ink); box-shadow: 0 4px 16px rgba(43,38,32,0.08); border: 1px solid var(--rule); transition: transform 0.15s ease, box-shadow 0.15s ease; text-align: left; }
  .choice:hover, .choice:active { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(43,38,32,0.15); }
  .choice .icon { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: #fff; position: relative; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 1px var(--rule); }
  .choice .icon img { width: 82%; height: 82%; object-fit: contain; }
  .choice .icon .badge { position: absolute; bottom: -3px; right: -3px; background: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; box-shadow: 0 1px 4px rgba(0,0,0,0.35), inset 0 0 0 1px var(--rule); }
  .choice .txt strong { display: block; font-size: 1.05rem; margin-bottom: 2px; }
  .choice .txt span { font-size: 0.85rem; color: var(--ink-soft); }
  .choice .arrow { margin-left: auto; color: var(--ink-soft); font-size: 1.2rem; }

  .lightbox { display: none; position: fixed; inset: 0; background: rgba(20,16,12,0.82); z-index: 200; align-items: center; justify-content: center; padding: 24px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 85vh; border-radius: 12px; background: #fff; padding: 16px; }
</style>
</head>
<body>

<div class="home">
  <button class="logo-wrap" id="logoBtn" aria-label="Vergroot logo">
    <img src="media/image1.jpg" alt="Circle Oriëntaties logo">
  </button>
  <h1>De Circle Oriëntaties Methode<sup style="font-size:0.5em;">®</sup></h1>
  <p class="by">Ontwikkeld door <strong>Ruud van Hussen</strong></p>

  <div class="choices">
    <a class="choice" href="methode.html">
      <span class="icon"><img src="media/image2.jpg" alt=""></span>
      <span class="txt"><strong>De Methode</strong><span>Het volledige boek, van voorwoord tot bijlagen</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="choice" href="snelzoeker.html">
      <span class="icon"><img src="media/image2.jpg" alt=""><span class="badge">🔍</span></span>
      <span class="txt"><strong>Snelzoeker</strong><span>Stijlen, interactiepatronen &amp; themakaartjes direct opzoeken</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="choice" href="snelzoeker.html?tab=mijncirkel">
      <span class="icon"><img src="media/Circle%20Logo.png" alt=""></span>
      <span class="txt"><strong>Mijn Cirkel</strong><span>Jouw eigen sterkten, valkuilen, leerpunten &amp; afkeuren invullen</span></span>
      <span class="arrow">→</span>
    </a>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img src="media/image1.jpg" alt="Circle Oriëntaties logo, vergroot">
</div>

<script>
  const logoBtn = document.getElementById("logoBtn");
  const lightbox = document.getElementById("lightbox");
  logoBtn.addEventListener("click", () => lightbox.classList.add("open"));
  lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
</script>
</body>
</html>

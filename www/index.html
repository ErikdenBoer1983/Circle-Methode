<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Methode</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow-x: hidden; max-width: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  a.splash { display: block; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .cirkel-wrap { width: min(88vw, 420px); position: relative; }
  .cirkel-wrap img { width: 100%; height: auto; display: block; }
  .cirkel-overlay { position: absolute; background: rgba(255,255,255,0.4); border-radius: 6px; padding: 5px 8px;
    font-size: 0.72rem; line-height: 1.25; font-weight: 700; color: #000; overflow: hidden; white-space: pre-line; box-sizing: border-box; }
  .cirkel-overlay.leeg { color: rgba(0,0,0,0.55); font-style: italic; font-weight: 400; }
  .cirkel-overlay.tl { top: 16.5%; left: 19%; right: 51%; bottom: 53.5%; text-align: right; }
  .cirkel-overlay.tr { top: 16.5%; left: 51%; right: 19%; bottom: 53.5%; text-align: left; }
  .cirkel-overlay.bl { top: 48.5%; left: 19%; right: 51%; bottom: 21.5%; text-align: right; }
  .cirkel-overlay.br { top: 48.5%; left: 51%; right: 19%; bottom: 21.5%; text-align: left; }
  p.hint { text-align: center; color: #999; font-size: 0.78rem; margin-top: 16px; }

  .stijlranglijst { width: min(88vw, 420px); margin: 18px auto 0; border-top: 1px solid #eee; padding-top: 12px; }
  .stijlranglijst .rij { display: flex; align-items: center; gap: 8px; padding: 3px 2px; }
  .stijlranglijst .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .stijlranglijst .label { font-size: 0.66rem; color: #b3b3b3; min-width: 58px; }
  .stijlranglijst .naam { font-size: 0.78rem; color: #888; }
  .stijlranglijst .score { margin-left: auto; font-size: 0.7rem; color: #bbb; }
</style>
</head>
<body>

<div>
  <a class="splash" href="home.html">
    <div class="cirkel-wrap">
      <img src="media/Circle%20Logo.png" alt="Mijn Cirkel">
      <div class="cirkel-overlay leeg tl" id="ovSterkten">Sterkten</div>
      <div class="cirkel-overlay leeg tr" id="ovValkuilen">Valkuilen</div>
      <div class="cirkel-overlay leeg bl" id="ovAfkeuren">Afkeuren</div>
      <div class="cirkel-overlay leeg br" id="ovLeerpunten">Leerpunten</div>
    </div>
  </a>
  <p class="hint">Tik op je cirkel om verder te gaan</p>
  <div class="stijlranglijst" id="stijlRanglijst"></div>
</div>

<script>
  (function() {
    let opgeslagen = {};
    try { opgeslagen = JSON.parse(localStorage.getItem("circleMethode.mijnCirkel")) || {}; } catch (e) { opgeslagen = {}; }
    const overlayLabels = { sterkten: "Sterkten", valkuilen: "Valkuilen", afkeuren: "Afkeuren", leerpunten: "Leerpunten" };
    const overlays = {
      sterkten: document.getElementById("ovSterkten"),
      valkuilen: document.getElementById("ovValkuilen"),
      afkeuren: document.getElementById("ovAfkeuren"),
      leerpunten: document.getElementById("ovLeerpunten"),
    };
    Object.keys(overlays).forEach(key => {
      const tekst = (opgeslagen[key] || "").trim();
      overlays[key].textContent = tekst || overlayLabels[key];
      overlays[key].classList.toggle("leeg", !tekst);
    });

    const oriNames = { c1: "Ondersteunen", c2: "Ondernemen", c3: "Onderbouwen", c4: "Overdenken", c5: "Overleggen", c6: "Overeenkomen" };
    const styleColors = { c1: "#1F7A3D", c2: "#D64545", c3: "#3090D8", c4: "#7D3C5C", c5: "#D9A916", c6: "#E8752C" };
    const rangLabels = ["Hoofdstijl", "Hulpstijl", "Substijl", "Substijl", "Substijl", "Substijl"];
    const scores = opgeslagen.scores || {};
    const codes = ["c1", "c2", "c3", "c4", "c5", "c6"];
    const ingevuld = codes.filter(c => scores[c] !== "" && scores[c] !== undefined && !isNaN(Number(scores[c])));
    const lijst = document.getElementById("stijlRanglijst");
    if (ingevuld.length) {
      const gerangschikt = ingevuld.slice().sort((a, b) => Number(scores[b]) - Number(scores[a]));
      lijst.innerHTML = gerangschikt.map((c, i) => `
        <div class="rij">
          <span class="dot" style="background:${styleColors[c]};"></span>
          <span class="label">${rangLabels[i] || "Substijl"}</span>
          <span class="naam">${oriNames[c]}</span>
          <span class="score">${scores[c]}</span>
        </div>`).join("");
    }
  })();
</script>
</body>
</html>
